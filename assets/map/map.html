<!DOCTYPE html>
<!--
assets/map/map.html

The map shown inside the app (ui/widgets/map_view.py loads this file into
a QWebEngineView). Used by both the Dashboard (historical routes) and the
Live Map page (the active flight). It only draws - it never touches the
database or the sim. Python drives it through window.ACARS:

    ACARS.setHistory(routes, {fit: true})
        routes: [{id, dep: {icao, lat, lon}, arr: {icao, lat, lon}}, ...]
        Drawn as great-circle arcs in the accent colour. Flights flying the
        same airport pair share one arc. fit=true zooms to show them all.
    ACARS.highlightFlight(id)      brighter arc + zoom to it (null clears)
    ACARS.setLive(live)            the active flight (null removes it):
        {lat, lon, heading,
         flown:     [[lon, lat], ...]   recorded track, ends at the aircraft
         remaining: [[lon, lat], ...]   aircraft -> remaining waypoints -> destination
         popup: {pilot, dep, arr, registration, title,
                 altitude_ft, ias_kt, remaining_nm}}
        Hovering the plane shows the popup plus the route (flown part
        solid, remaining part dashed); leaving it hides both.
    ACARS.setNetwork(network)      online traffic + ATC (null removes them):
        {traffic:  [{callsign, name, lat, lon, heading, altitude, groundspeed,
                     aircraft, wake, dep, arr, dep_pos, arr_pos}],
         sectors:  [{id, kind ("fir"/"uir"/"tracon"), name, geometry (GeoJSON),
                     label: [lon, lat], controllers: [...]}],
         stations: [{icao, name, lat, lon, controllers: [...]}]}
        controllers: [{callsign, position, frequency, name, atis: [lines],
                       rating, logon (Unix seconds)}]
        (core/networks.py + core/sectors.py). Sectors are drawn as outlines
        under everything else, each airport as a row of coloured badges (one
        per service online - BADGES), traffic as grey planes sized by wake
        category (WAKE_SCALE). Hovering shows who it is; hovering a plane
        also shows its route (departure -> plane solid, plane -> arrival
        dashed). Clicking a sector or a badge opens the controller details
        panel at the top left (closed with its X, Esc or a click elsewhere).
    ACARS.resetView()              back to the whole-world view

Calls made before the map has finished loading are queued and run once it
has. Colours come from the page URL (?accent=...&bg=...), which the widget
fills in from ui/theme.py's PALETTE.

Load state is reported through the page title (the widget listens for
titleChanged): "acars-map:ready" once the map has been drawn for the first
time, or "acars-map:unavailable" if MapLibre or both map styles couldn't
be loaded.

Map: MapLibre GL JS + OpenFreeMap's free dark style (no API key). If that
style can't be loaded, CARTO's dark raster tiles are used instead. Both
need an internet connection; without one a message is shown instead.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
    @font-face { font-family: "Roboto"; src: url("../fonts/Roboto-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Roboto"; src: url("../fonts/Roboto-Medium.ttf"); font-weight: 500; }
    @font-face { font-family: "Roboto"; src: url("../fonts/Roboto-Bold.ttf"); font-weight: 700; }

    html, body, #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: "Roboto", sans-serif;
    }

    #message {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        color: var(--text-secondary);
        font-size: 13px;
    }

    .maplibregl-popup-content {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 10px 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        font-size: 12px;
        line-height: 1.6;
        color: var(--text);
        white-space: nowrap;
    }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--border); }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--border); }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--border); }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--border); }

    .popup-pilot { color: var(--accent); font-weight: 500; }
    .popup-route { color: var(--text); font-weight: 700; }
    .popup-aircraft { color: var(--text-secondary); }
    .popup-stats { color: var(--positive-text); }
    .maplibregl-popup, .maplibregl-popup-content { pointer-events: none; }
    .popup-atc { color: var(--text); }
    .popup-note {
        color: var(--text-secondary);
        white-space: normal;
        max-width: 340px;
        font-size: 11px;
        line-height: 1.4;
    }

    #atc-panel {
        display: none;
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 3;
        width: 320px;
        max-height: calc(100% - 110px);
        overflow-y: auto;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        color: var(--text);
        font-size: 12px;
        line-height: 1.5;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .panel-title { font-weight: 700; }
    .panel-subtitle { color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }
    .panel-close {
        background: none;
        border: none;
        padding: 0 2px;
        color: var(--text-secondary);
        font-size: 14px;
        cursor: pointer;
    }
    .panel-close:hover { color: var(--text); }
    .panel-controller { margin-top: 8px; padding: 4px 0 4px 8px; border-left: 3px solid var(--border); }
    .panel-callsign { font-weight: 500; }
    .panel-frequency { color: var(--positive-text); }
    .panel-details { color: var(--text-secondary); font-size: 11px; }
    .panel-atis {
        margin-top: 2px;
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .maplibregl-ctrl-group {
        background: var(--panel);
        border: 1px solid var(--border);
    }
    .maplibregl-ctrl-group button + button { border-top-color: var(--border); }
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1) brightness(0.8); }
    .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib.maplibregl-compact {
        background: rgba(0, 0, 0, 0.55);
        color: var(--text-secondary);
    }
    .maplibregl-ctrl-attrib a { color: var(--text-secondary); }
    .maplibregl-ctrl-attrib-button { filter: invert(1); }
</style>
</head>
<body>
<div id="map"></div>
<div id="message"></div>
<div id="atc-panel"></div>

<script>
(function () {
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const COLORS = {
        accent:        params.get("accent")         || "#e4a125",
        bg:            params.get("bg")             || "#0e0e0e",
        panel:         params.get("panel")          || "#1a1a1a",
        border:        params.get("border")         || "#3e3d40",
        text:          params.get("text")           || "#f5f6f6",
        textSecondary: params.get("text_secondary") || "#6c7381",
        positive:      params.get("positive")       || "#2d783d",
    };
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty("--accent", COLORS.accent);
    rootStyle.setProperty("--bg", COLORS.bg);
    rootStyle.setProperty("--panel", COLORS.panel);
    rootStyle.setProperty("--border", COLORS.border);
    rootStyle.setProperty("--text", COLORS.text);
    rootStyle.setProperty("--text-secondary", COLORS.textSecondary);
    rootStyle.setProperty("--positive-text", "#4fbf68");

    const WORLD_VIEW = { center: [0, 25], zoom: 1 };
    const PRIMARY_STYLE = "https://tiles.openfreemap.org/styles/dark";
    const FALLBACK_STYLE = {
        version: 8,
        sources: {
            carto: {
                type: "raster",
                tiles: ["a", "b", "c", "d"].map(
                    s => `https://${s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png`),
                tileSize: 256,
                attribution: "© OpenStreetMap contributors © CARTO",
            },
        },
        layers: [{ id: "carto", type: "raster", source: "carto" }],
    };

    const ATC_COLORS = { fir: "#4a9fd8", tracon: "#3fbfa0" };
    const SECTOR_COLOR = ["match", ["get", "kind"], "tracon", ATC_COLORS.tracon, ATC_COLORS.fir];
    const TRAFFIC_COLOR = "#aeb6c2";
    const WAKE_SCALE = ["match", ["get", "wake"], "L", 0.6, "H", 1.35, "J", 1.6, 1];
    const BADGES = [
        { letter: "D", positions: ["DEL"], color: "#5b8def", title: "Delivery" },
        { letter: "G", positions: ["GND"], color: "#3fbf6a", title: "Ground" },
        { letter: "T", positions: ["TWR"], color: "#e05252", title: "Tower" },
        { letter: "A", positions: ["APP", "DEP"], color: ATC_COLORS.tracon, title: "Approach / Departure" },
        { letter: "C", positions: ["CTR", "FSS"], color: ATC_COLORS.fir, title: "Centre" },
        { letter: "i", positions: ["ATIS"], color: "#c792ea", title: "ATIS" },
    ];
    const BADGE_SIZE = 16;
    const BADGE_GAP = 2;
    const KIND_TITLES = { fir: "Centre", uir: "Upper area", tracon: "Approach / Departure" };
    const SECTOR_ATTRIBUTION = "ATC sectors: VATSpy Data Project, SimAware TRACON Project (CC BY-SA 4.0)";

    const R_NM = 3440.065;
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;

    function distanceNm(a, b) {
        const p1 = toRad(a[1]), p2 = toRad(b[1]);
        const dp = p2 - p1, dl = toRad(b[0] - a[0]);
        const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
        return 2 * R_NM * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function greatCircle(a, b) {
        const d = distanceNm(a, b) / R_NM;
        if (d < 1e-6) return [a.slice(), b.slice()];
        const steps = Math.max(2, Math.min(128, Math.ceil(d * R_NM / 50)));
        const lat1 = toRad(a[1]), lon1 = toRad(a[0]);
        const lat2 = toRad(b[1]), lon2 = toRad(b[0]);
        const points = [];
        for (let i = 0; i <= steps; i++) {
            const f = i / steps;
            const A = Math.sin((1 - f) * d) / Math.sin(d);
            const B = Math.sin(f * d) / Math.sin(d);
            const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
            const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
            const z = A * Math.sin(lat1) + B * Math.sin(lat2);
            points.push([toDeg(Math.atan2(y, x)), toDeg(Math.atan2(z, Math.sqrt(x * x + y * y)))]);
        }
        points[0] = a.slice();
        points[points.length - 1] = b.slice();
        return points;
    }

    function unwrap(points, startLon) {
        let prev = startLon === undefined ? null : startLon;
        return points.map(p => {
            let lon = p[0];
            if (prev !== null) {
                while (lon - prev > 180) lon -= 360;
                while (lon - prev < -180) lon += 360;
            }
            prev = lon;
            return [lon, p[1]];
        });
    }

    function greatCirclePath(points) {
        const out = [];
        for (let i = 0; i < points.length - 1; i++) {
            const leg = greatCircle(points[i], points[i + 1]);
            out.push(...(i === 0 ? leg : leg.slice(1)));
        }
        return points.length === 1 ? [points[0].slice()] : out;
    }

    function validPoint(p) {
        return Array.isArray(p) && p.length >= 2 && Number.isFinite(p[0]) && Number.isFinite(p[1]);
    }

    function routeKey(dep, arr) {
        return `${dep.icao}|${dep.lat.toFixed(4)},${dep.lon.toFixed(4)}>` +
               `${arr.icao}|${arr.lat.toFixed(4)},${arr.lon.toFixed(4)}`;
    }

    function formatNumber(n) {
        return Math.round(n).toLocaleString("en-US");
    }

    function formatAltitude(ft) {
        if (!Number.isFinite(ft)) return "—";
        if (ft >= 18000) return "FL" + String(Math.round(ft / 100)).padStart(3, "0");
        return formatNumber(ft) + " ft";
    }

    const EMPTY = { type: "FeatureCollection", features: [] };

    const state = {
        history: EMPTY,
        airports: EMPTY,
        flightToKey: {},
        keyBounds: {},
        highlightKey: null,
        live: null,
        hovering: false,
        debrief: null,
        network: null,
        networkHover: null,
        panelKey: null,
    };

    let ready = false;
    const queue = [];
    function whenReady(fn) {
        if (ready) fn(); else queue.push(fn);
    }
    window.ACARS = {
        setHistory: (routes, opts) => whenReady(() => setHistory(routes, opts || {})),
        highlightFlight: id => whenReady(() => highlightFlight(id)),
        setLive: live => whenReady(() => setLive(live)),
        setDebrief: debrief => whenReady(() => setDebrief(debrief)),
        setNetwork: network => whenReady(() => setNetwork(network)),
        resetView: () => whenReady(() => map.jumpTo(WORLD_VIEW)),
        _geo: { distanceNm, greatCircle, greatCirclePath, unwrap, formatAltitude },
    };

    function reportState(value) {
        document.title = "acars-map:" + value;
    }

    function showMessage(text) {
        const el = document.getElementById("message");
        el.textContent = text;
        el.style.display = "flex";
    }

    if (typeof maplibregl === "undefined") {
        showMessage("Map unavailable - it needs an internet connection.");
        reportState("unavailable");
        return;
    }

    const map = new maplibregl.Map({
        container: "map",
        style: PRIMARY_STYLE,
        center: WORLD_VIEW.center,
        zoom: WORLD_VIEW.zoom,
        minZoom: 0.5,
        maxZoom: 14,
        dragRotate: false,
        pitchWithRotate: false,
        attributionControl: { compact: true },
    });
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-left");

    let styleOk = false;
    let usingFallback = false;
    map.on("error", e => {
        if (styleOk) return;
        if (!usingFallback) {
            usingFallback = true;
            console.warn("OpenFreeMap style failed, using CARTO fallback:", e && e.error);
            map.setStyle(FALLBACK_STYLE);
        } else {
            reportState("unavailable");
        }
    });

    function makePlaneImage(color) {
        const size = 48, ratio = 2;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.scale(size / 24, size / 24);
        const path = new Path2D("M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z");
        ctx.lineWidth = 1.2;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
        ctx.stroke(path);
        ctx.fillStyle = color;
        ctx.fill(path);
        return { image: ctx.getImageData(0, 0, size, size), pixelRatio: ratio };
    }

    function addLayers() {
        if (!map.hasImage("plane")) {
            const plane = makePlaneImage(COLORS.accent);
            map.addImage("plane", plane.image, { pixelRatio: plane.pixelRatio });
            map.addSource("debrief-planned", { type: "geojson", data: EMPTY });
            map.addSource("debrief-flown", { type: "geojson", data: EMPTY });
            map.addSource("debrief-airports", { type: "geojson", data: EMPTY });
        }

        map.addSource("history", { type: "geojson", data: state.history });
        map.addSource("history-airports", { type: "geojson", data: state.airports });
        map.addSource("live-flown", { type: "geojson", data: EMPTY });
        map.addSource("live-remaining", { type: "geojson", data: EMPTY });
        map.addSource("live-plane", { type: "geojson", data: EMPTY });
        map.addSource("net-sectors", { type: "geojson", data: EMPTY, attribution: SECTOR_ATTRIBUTION });
        map.addSource("net-sector-labels", { type: "geojson", data: EMPTY });
        map.addSource("net-stations", { type: "geojson", data: EMPTY });
        map.addSource("net-traffic", { type: "geojson", data: EMPTY });
        map.addSource("net-route-flown", { type: "geojson", data: EMPTY });
        map.addSource("net-route-remaining", { type: "geojson", data: EMPTY });
        if (!map.hasImage("traffic-plane")) {
            const traffic = makePlaneImage(TRAFFIC_COLOR);
            map.addImage("traffic-plane", traffic.image, { pixelRatio: traffic.pixelRatio });
        }

        map.addLayer({
            id: "net-sector-fill", type: "fill", source: "net-sectors",
            paint: { "fill-color": SECTOR_COLOR, "fill-opacity": 0.1 },
        });
        map.addLayer({
            id: "net-sector-line", type: "line", source: "net-sectors",
            layout: { "line-join": "round" },
            paint: { "line-color": SECTOR_COLOR, "line-opacity": 0.7, "line-width": 1 },
        });
        map.addLayer({
            id: "net-sector-hover", type: "line", source: "net-sectors",
            filter: ["==", ["get", "idx"], -1],
            layout: { "line-join": "round" },
            paint: { "line-color": SECTOR_COLOR, "line-width": 2.5 },
        });

        map.addLayer({
            id: "history-lines", type: "line", source: "history",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": COLORS.accent, "line-opacity": 0.4, "line-width": 1.4 },
        });
        map.addLayer({
            id: "history-highlight", type: "line", source: "history",
            filter: ["==", ["get", "key"], ""],
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": COLORS.accent, "line-opacity": 1, "line-width": 3 },
        });
        map.addLayer({
            id: "history-airports", type: "circle", source: "history-airports",
            paint: {
                "circle-radius": 2.5,
                "circle-color": COLORS.accent,
                "circle-stroke-color": COLORS.bg,
                "circle-stroke-width": 1,
            },
        });

        map.addLayer({
            id: "net-route-flown", type: "line", source: "net-route-flown",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": TRAFFIC_COLOR, "line-width": 1.8 },
        });
        map.addLayer({
            id: "net-route-remaining", type: "line", source: "net-route-remaining",
            layout: { "line-join": "round" },
            paint: { "line-color": TRAFFIC_COLOR, "line-width": 1.5, "line-opacity": 0.8,
                     "line-dasharray": [2, 2] },
        });
        map.addLayer({
            id: "net-traffic", type: "symbol", source: "net-traffic",
            layout: {
                "icon-image": "traffic-plane",
                "icon-size": ["interpolate", ["linear"], ["zoom"],
                              1, ["*", 0.35, WAKE_SCALE], 6, ["*", 0.55, WAKE_SCALE]],
                "icon-rotate": ["get", "heading"],
                "icon-rotation-alignment": "map",
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
            },
        });
        map.addLayer({
            id: "net-stations", type: "symbol", source: "net-stations",
            layout: {
                "icon-image": ["get", "row"],
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
            },
        });
        if (map.getStyle().glyphs) {
            map.addLayer({
                id: "net-sector-labels", type: "symbol", source: "net-sector-labels",
                layout: { "text-field": ["get", "text"], "text-size": 10, "text-font": ["Noto Sans Regular"] },
                paint: { "text-color": SECTOR_COLOR, "text-halo-color": COLORS.bg, "text-halo-width": 1.2 },
            });
            map.addLayer({
                id: "net-station-labels", type: "symbol", source: "net-stations", minzoom: 4,
                layout: {
                    "text-field": ["get", "label"],
                    "text-size": 10,
                    "text-offset": [0, 0.8],
                    "text-anchor": "top",
                    "text-font": ["Noto Sans Regular"],
                },
                paint: { "text-color": COLORS.text, "text-halo-color": COLORS.bg, "text-halo-width": 1.2 },
            });
        }

        map.addLayer({
            id: "live-flown", type: "line", source: "live-flown",
            layout: { "line-cap": "round", "line-join": "round", visibility: "none" },
            paint: { "line-color": COLORS.accent, "line-width": 2.5 },
        });
        map.addLayer({
            id: "live-remaining", type: "line", source: "live-remaining",
            layout: { "line-join": "round", visibility: "none" },
            paint: { "line-color": COLORS.accent, "line-width": 2, "line-opacity": 0.85,
                     "line-dasharray": [2, 2] },
        });
        map.addLayer({
            id: "live-plane", type: "symbol", source: "live-plane",
            layout: {
                "icon-image": "plane",
                "icon-size": 0.75,
                "icon-rotate": ["get", "heading"],
                "icon-rotation-alignment": "map",
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
            },
        });

                map.addLayer({
            id: "debrief-planned", type: "line", source: "debrief-planned",
            layout: { "line-join": "round" },
            paint: { "line-color": COLORS.textSecondary, "line-width": 1.5, "line-dasharray": [3, 2] },
        });
        map.addLayer({
            id: "debrief-flown", type: "line", source: "debrief-flown",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": COLORS.accent, "line-width": 2.5 },
        });
        map.addLayer({
            id: "debrief-airports", type: "circle", source: "debrief-airports",
            paint: {
                "circle-radius": 4,
                "circle-color": COLORS.accent,
                "circle-stroke-color": COLORS.bg,
                "circle-stroke-width": 2,
            },
        });
        if (map.getStyle().glyphs) map.addLayer({
            id: "debrief-airport-labels", type: "symbol", source: "debrief-airports",
            layout: {
                "text-field": ["get", "icao"],
                "text-size": 11,
                "text-offset": [0, 1.1],
                "text-anchor": "top",
                "text-font": ["Noto Sans Regular"],
            },
            paint: { "text-color": COLORS.text, "text-halo-color": COLORS.bg, "text-halo-width": 1.5 },
        });

        applyHighlight();
        renderLive();
        renderDebrief(false);
        renderNetwork();
    }

    function setDebrief(debrief) {
        state.debrief = debrief || null;
        renderDebrief(true);
    }

    function renderDebrief(fit) {
        const flownSource = map.getSource("debrief-flown");
        if (!flownSource) return;
        const d = state.debrief;
        if (!d) {
            flownSource.setData(EMPTY);
            map.getSource("debrief-planned").setData(EMPTY);
            map.getSource("debrief-airports").setData(EMPTY);
            return;
        }

        const plannedRaw = (d.planned || []).filter(validPoint);
        const planned = plannedRaw.length > 1 ? unwrap(greatCirclePath(plannedRaw)) : [];
        const flownRaw = (d.flown || []).filter(validPoint);
        const flown = flownRaw.length > 1 ? unwrap(flownRaw, planned.length ? planned[0][0] : undefined) : [];
        const airports = (d.airports || []).filter(a => a && validPoint([a.lon, a.lat]));

        map.getSource("debrief-planned").setData(lineFeature(planned));
        flownSource.setData(lineFeature(flown));
        map.getSource("debrief-airports").setData({
            type: "FeatureCollection",
            features: airports.map(a => ({
                type: "Feature", properties: { icao: a.icao || "" },
                geometry: { type: "Point", coordinates: [a.lon, a.lat] },
            })),
        });

        if (fit) {
            const all = planned.concat(flown).concat(airports.map(a => [a.lon, a.lat]));
            if (all.length) fitTo(boundsOf(all), 9);
        }
    }

    map.on("style.load", () => {
        styleOk = true;
        addLayers();
        if (!ready) {
            ready = true;
            queue.splice(0).forEach(fn => fn());
            reportState("ready");
        }
    });

    function setHistory(routes, opts) {
        const byKey = {};
        const airports = {};
        state.flightToKey = {};
        state.keyBounds = {};

        (routes || []).forEach(r => {
            const dep = r && r.dep, arr = r && r.arr;
            if (!dep || !arr || !validPoint([dep.lon, dep.lat]) || !validPoint([arr.lon, arr.lat])) return;
            const key = routeKey(dep, arr);
            state.flightToKey[r.id] = key;
            if (!byKey[key]) {
                const coords = unwrap(greatCircle([dep.lon, dep.lat], [arr.lon, arr.lat]));
                byKey[key] = {
                    type: "Feature",
                    properties: { key },
                    geometry: { type: "LineString", coordinates: coords },
                };
                state.keyBounds[key] = boundsOf(coords);
            }
            airports[dep.icao + dep.lat + dep.lon] = [dep.lon, dep.lat];
            airports[arr.icao + arr.lat + arr.lon] = [arr.lon, arr.lat];
        });

        state.history = { type: "FeatureCollection", features: Object.values(byKey) };
        state.airports = {
            type: "FeatureCollection",
            features: Object.values(airports).map(c => ({
                type: "Feature", properties: {}, geometry: { type: "Point", coordinates: c },
            })),
        };
        if (!(state.highlightKey in state.keyBounds)) state.highlightKey = null;

        map.getSource("history").setData(state.history);
        map.getSource("history-airports").setData(state.airports);
        applyHighlight();

        if (opts.fit && state.history.features.length) {
            const all = state.history.features.flatMap(f => f.geometry.coordinates);
            fitTo(boundsOf(all), 5);
        }
    }

    function highlightFlight(id) {
        const key = id === null || id === undefined ? null : state.flightToKey[id];
        state.highlightKey = key || null;
        applyHighlight();
        if (state.highlightKey) fitTo(state.keyBounds[state.highlightKey], 7);
    }

    function applyHighlight() {
        if (!map.getLayer("history-highlight")) return;
        map.setFilter("history-highlight", ["==", ["get", "key"], state.highlightKey || ""]);
        map.setPaintProperty("history-lines", "line-opacity", state.highlightKey ? 0.2 : 0.4);
    }

    function boundsOf(coords) {
        const b = [[Infinity, Infinity], [-Infinity, -Infinity]];
        coords.forEach(([lon, lat]) => {
            b[0][0] = Math.min(b[0][0], lon); b[0][1] = Math.min(b[0][1], lat);
            b[1][0] = Math.max(b[1][0], lon); b[1][1] = Math.max(b[1][1], lat);
        });
        return b;
    }

    function fitTo(bounds, maxZoom) {
        if (!bounds || !Number.isFinite(bounds[0][0])) return;
        map.fitBounds(bounds, { padding: 40, maxZoom, duration: 600 });
    }

    const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 16,
        maxWidth: "none",
    });

    function setLive(live) {
        state.live = live && validPoint([live.lon, live.lat]) ? live : null;
        renderLive();
    }

    function renderLive() {
        const plane = map.getSource("live-plane");
        if (!plane) return;
        const live = state.live;

        if (!live) {
            plane.setData(EMPTY);
            map.getSource("live-flown").setData(EMPTY);
            map.getSource("live-remaining").setData(EMPTY);
            setHover(false);
            return;
        }

        const flownRaw = (live.flown || []).filter(validPoint);
        const flown = unwrap(flownRaw.length ? flownRaw : [[live.lon, live.lat]]);
        const here = flown[flown.length - 1];
        const planeLon = unwrap([[live.lon, live.lat]], here[0])[0][0];

        const remainingRaw = (live.remaining || []).filter(validPoint);
        const remaining = remainingRaw.length > 1
            ? unwrap(greatCirclePath(remainingRaw), planeLon)
            : [];

        plane.setData({
            type: "FeatureCollection",
            features: [{
                type: "Feature",
                properties: { heading: Number.isFinite(live.heading) ? live.heading : 0 },
                geometry: { type: "Point", coordinates: [planeLon, live.lat] },
            }],
        });
        map.getSource("live-flown").setData(lineFeature(flown));
        map.getSource("live-remaining").setData(lineFeature(remaining));

        popup.setLngLat([planeLon, live.lat]);
        if (state.hovering) popup.setDOMContent(popupContent(live.popup || {}));
    }

    function lineFeature(coords) {
        if (coords.length < 2) return EMPTY;
        return { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } };
    }

    function popupContent(p) {
        const root = document.createElement("div");
        const line = (cls, text) => {
            const el = document.createElement("div");
            el.className = cls;
            el.textContent = text;
            root.appendChild(el);
        };
        const aircraft = [p.registration, p.title].filter(Boolean).join(" · ");
        const remaining = Number.isFinite(p.remaining_nm) ? formatNumber(p.remaining_nm) + " nm" : "—";
        const ias = Number.isFinite(p.ias_kt) ? formatNumber(p.ias_kt) + " kt" : "—";

        line("popup-pilot", p.pilot || "—");
        line("popup-route", `${p.dep || "—"} → ${p.arr || "—"}`);
        line("popup-aircraft", aircraft || "—");
        line("popup-stats", `${formatAltitude(p.altitude_ft)} · ${ias} · ${remaining}`);
        return root;
    }

    function setHover(on) {
        state.hovering = on && state.live !== null;
        const visibility = state.hovering ? "visible" : "none";
        map.setLayoutProperty("live-flown", "visibility", visibility);
        map.setLayoutProperty("live-remaining", "visibility", visibility);
        map.getCanvas().style.cursor = state.hovering ? "pointer" : "";
        if (state.hovering) {
            popup.setDOMContent(popupContent(state.live.popup || {}));
            if (!popup.isOpen()) popup.addTo(map);
        } else {
            popup.remove();
        }
    }

    map.on("mouseenter", "live-plane", () => setHover(true));
    map.on("mouseleave", "live-plane", () => setHover(false));

    function setNetwork(network) {
        state.network = network || null;
        renderNetwork();
    }

    function collection(features) {
        return { type: "FeatureCollection", features };
    }

    function pointFeature(coords, properties) {
        return { type: "Feature", properties, geometry: { type: "Point", coordinates: coords } };
    }

    function sectorLabel(sector) {
        const controllers = sector.controllers || [];
        if (!controllers.length) return sector.name || "";
        return controllers[0].callsign + (controllers.length > 1 ? ` +${controllers.length - 1}` : "");
    }

    function stationBadges(station) {
        const controllers = station.controllers || [];
        return BADGES
            .map(badge => ({ badge, controllers: controllers.filter(c => badge.positions.includes(c.position)) }))
            .filter(group => group.controllers.length);
    }

    function badgeColor(position) {
        const badge = BADGES.find(b => b.positions.includes(position));
        return badge ? badge.color : COLORS.border;
    }

    function makeBadgeRow(letters) {
        const ratio = 2;
        const badges = letters.split("").map(l => BADGES.find(b => b.letter === l)).filter(Boolean);
        const width = Math.max(1, badges.length * BADGE_SIZE + (badges.length - 1) * BADGE_GAP);
        const canvas = document.createElement("canvas");
        canvas.width = width * ratio;
        canvas.height = BADGE_SIZE * ratio;
        const ctx = canvas.getContext("2d");
        ctx.scale(ratio, ratio);
        ctx.font = "bold 10px Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        badges.forEach((badge, i) => {
            const x = i * (BADGE_SIZE + BADGE_GAP);
            ctx.beginPath();
            ctx.roundRect(x + 0.5, 0.5, BADGE_SIZE - 1, BADGE_SIZE - 1, 3);
            ctx.fillStyle = badge.color;
            ctx.fill();
            ctx.strokeStyle = "rgba(0, 0, 0, 0.7)";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = "#0e0e0e";
            ctx.fillText(badge.letter, x + BADGE_SIZE / 2, BADGE_SIZE / 2 + 0.5);
        });
        return { image: ctx.getImageData(0, 0, canvas.width, canvas.height), pixelRatio: ratio };
    }

    map.on("styleimagemissing", e => {
        if (!e.id.startsWith("atc-row:") || map.hasImage(e.id)) return;
        const row = makeBadgeRow(e.id.slice("atc-row:".length));
        map.addImage(e.id, row.image, { pixelRatio: row.pixelRatio });
    });

    function renderNetwork() {
        const sectorsSource = map.getSource("net-sectors");
        if (!sectorsSource) return;
        const n = state.network || {};
        const sectors = n.sectors || [], stations = n.stations || [], traffic = n.traffic || [];

        sectorsSource.setData(collection(sectors
            .map((s, idx) => s && s.geometry
                ? { type: "Feature", properties: { idx, kind: s.kind }, geometry: s.geometry }
                : null)
            .filter(Boolean)));
        map.getSource("net-sector-labels").setData(collection(sectors
            .map((s, idx) => s && validPoint(s.label)
                ? pointFeature(s.label, { idx, kind: s.kind, text: sectorLabel(s) })
                : null)
            .filter(Boolean)));
        map.getSource("net-stations").setData(collection(stations
            .map((st, idx) => {
                const groups = st && validPoint([st.lon, st.lat]) ? stationBadges(st) : [];
                if (!groups.length) return null;
                const row = "atc-row:" + groups.map(g => g.badge.letter).join("");
                return pointFeature([st.lon, st.lat], { idx, row, label: st.icao });
            })
            .filter(Boolean)));
        map.getSource("net-traffic").setData(collection(traffic
            .map((t, idx) => t && validPoint([t.lon, t.lat])
                ? pointFeature([t.lon, t.lat], {
                    idx,
                    heading: Number.isFinite(t.heading) ? t.heading : 0,
                    wake: t.wake || "M",
                })
                : null)
            .filter(Boolean)));

        clearNetworkHover();
        if (state.panelKey) renderPanel();
    }

    const networkPopup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
        offset: 12,
        maxWidth: "none",
    });
    const NETWORK_LAYERS = ["net-traffic", "net-stations", "net-sector-fill"];

    function popupLines(rows) {
        const root = document.createElement("div");
        rows.forEach(([cls, text]) => {
            if (!text) return;
            const el = document.createElement("div");
            el.className = cls;
            el.textContent = text;
            root.appendChild(el);
        });
        return root;
    }

    function controllerRows(controllers) {
        const rows = [];
        (controllers || []).forEach(c => {
            rows.push(["popup-atc", [c.callsign, c.frequency, c.name].filter(Boolean).join("  ·  ")]);
            (c.atis || []).slice(0, 2).forEach(line =>
                rows.push(["popup-note", line.length > 160 ? line.slice(0, 157) + "…" : line]));
        });
        return rows;
    }

    function trafficContent(t) {
        const speed = Number.isFinite(t.groundspeed) ? formatNumber(t.groundspeed) + " kt GS" : "—";
        return popupLines([
            ["popup-pilot", t.callsign || "—"],
            ["popup-route", t.dep || t.arr ? `${t.dep || "—"} → ${t.arr || "—"}` : "No flight plan"],
            ["popup-aircraft", [t.aircraft, t.name].filter(Boolean).join(" · ")],
            ["popup-stats", `${formatAltitude(t.altitude)} · ${speed}`],
        ]);
    }

    function atcContent(target) {
        return popupLines([["popup-route", target.title || "—"], ["popup-aircraft", target.subtitle]]
            .concat(controllerRows(target.controllers)));
    }

    function clearNetworkHover() {
        state.networkHover = null;
        if (map.getLayer("net-sector-hover")) map.setFilter("net-sector-hover", ["==", ["get", "idx"], -1]);
        if (map.getSource("net-route-flown")) {
            map.getSource("net-route-flown").setData(EMPTY);
            map.getSource("net-route-remaining").setData(EMPTY);
        }
        networkPopup.remove();
    }

    function showTrafficRoute(t) {
        const here = [t.lon, t.lat];
        const flown = validPoint(t.dep_pos) ? unwrap(greatCircle(t.dep_pos, here)) : [];
        const startLon = flown.length ? flown[flown.length - 1][0] : undefined;
        const remaining = validPoint(t.arr_pos) ? unwrap(greatCircle(here, t.arr_pos), startLon) : [];
        map.getSource("net-route-flown").setData(lineFeature(flown));
        map.getSource("net-route-remaining").setData(lineFeature(remaining));
    }

    function sectorTarget(sector, idx) {
        return {
            key: "sector:" + sector.id, kind: "atc", sectorIdx: idx,
            title: sector.name || "—", subtitle: KIND_TITLES[sector.kind] || "",
            controllers: sector.controllers || [],
        };
    }

    function stationTarget(station, group) {
        return {
            key: `station:${station.icao}:${group.badge.letter}`, kind: "atc", sectorIdx: -1,
            title: [station.icao, station.name].filter(Boolean).join(" · "), subtitle: group.badge.title,
            controllers: group.controllers,
        };
    }

    function badgeAt(groups, stationPoint, point) {
        const width = groups.length * BADGE_SIZE + (groups.length - 1) * BADGE_GAP;
        const i = Math.floor((point.x - (stationPoint.x - width / 2)) / (BADGE_SIZE + BADGE_GAP));
        return groups[Math.max(0, Math.min(groups.length - 1, i))];
    }

    function networkTarget(point) {
        if (!state.network) return null;
        const layers = NETWORK_LAYERS.filter(id => map.getLayer(id));
        const hit = layers.length ? map.queryRenderedFeatures(point, { layers })[0] : null;
        if (!hit) return null;
        const n = state.network, idx = hit.properties.idx;
        if (hit.layer.id === "net-traffic") {
            const t = n.traffic && n.traffic[idx];
            return t ? { key: "traffic:" + idx, kind: "traffic", sectorIdx: -1, traffic: t,
                         at: hit.geometry.coordinates } : null;
        }
        if (hit.layer.id === "net-stations") {
            const station = n.stations && n.stations[idx];
            const groups = station ? stationBadges(station) : [];
            if (!groups.length) return null;
            const group = badgeAt(groups, map.project(hit.geometry.coordinates), point);
            return Object.assign(stationTarget(station, group), { at: hit.geometry.coordinates });
        }
        const sector = n.sectors && n.sectors[idx];
        return sector ? sectorTarget(sector, idx) : null;
    }

    function targetByKey(key) {
        const n = state.network;
        if (!n || !key) return null;
        if (key.startsWith("sector:")) {
            const idx = (n.sectors || []).findIndex(s => "sector:" + s.id === key);
            return idx < 0 ? null : sectorTarget(n.sectors[idx], idx);
        }
        const [, icao, letter] = key.split(":");
        const station = (n.stations || []).find(s => s.icao === icao);
        const group = station && stationBadges(station).find(g => g.badge.letter === letter);
        return group ? stationTarget(station, group) : null;
    }

    map.on("mousemove", e => {
        if (state.hovering) {
            if (state.networkHover) clearNetworkHover();
            return;
        }
        const target = networkTarget(e.point);
        map.getCanvas().style.cursor = target && target.kind === "atc" ? "pointer" : "";
        if (!target) {
            if (state.networkHover) clearNetworkHover();
            return;
        }
        if (state.networkHover !== target.key) {
            clearNetworkHover();
            state.networkHover = target.key;
            map.setFilter("net-sector-hover", ["==", ["get", "idx"], target.sectorIdx]);
            if (target.kind === "traffic") {
                networkPopup.setDOMContent(trafficContent(target.traffic));
                showTrafficRoute(target.traffic);
            } else {
                networkPopup.setDOMContent(atcContent(target));
            }
        }
        networkPopup.setLngLat(target.at || e.lngLat);
        if (!networkPopup.isOpen()) networkPopup.addTo(map);
    });

    const panel = document.getElementById("atc-panel");

    function onlineFor(logon) {
        if (!Number.isFinite(logon)) return "";
        const minutes = Math.max(0, Math.floor((Date.now() / 1000 - logon) / 60));
        return `online ${Math.floor(minutes / 60)}h ${String(minutes % 60).padStart(2, "0")}m`;
    }

    function panelContent(target) {
        const root = document.createElement("div");
        const add = (parent, cls, text, tag) => {
            const el = document.createElement(tag || "div");
            el.className = cls;
            el.textContent = text;
            parent.appendChild(el);
            return el;
        };
        const head = add(root, "panel-head", "");
        const titles = add(head, "", "");
        add(titles, "panel-title", target.title);
        if (target.subtitle) add(titles, "panel-subtitle", target.subtitle);
        add(head, "panel-close", "✕", "button").addEventListener("click", closePanel);

        target.controllers.forEach(c => {
            const box = add(root, "panel-controller", "");
            box.style.borderLeftColor = badgeColor(c.position);
            add(box, "panel-callsign", c.callsign);
            add(box, "panel-frequency", c.frequency);
            const details = [c.name, c.rating, onlineFor(c.logon)].filter(Boolean).join("  ·  ");
            if (details) add(box, "panel-details", details);
            (c.atis || []).forEach(line => add(box, "panel-atis", line));
        });
        return root;
    }

    function renderPanel() {
        const target = targetByKey(state.panelKey);
        if (!target) {
            closePanel();
            return;
        }
        panel.replaceChildren(panelContent(target));
        panel.style.display = "block";
    }

    function closePanel() {
        state.panelKey = null;
        panel.style.display = "none";
        panel.replaceChildren();
    }

    map.on("click", e => {
        if (state.hovering) return;
        const target = networkTarget(e.point);
        if (target && target.kind === "atc") {
            state.panelKey = target.key;
            renderPanel();
        } else {
            closePanel();
        }
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closePanel();
    });
    map.getCanvas().addEventListener("mouseleave", () => {
        if (state.networkHover) clearNetworkHover();
    });
})();
</script>
</body>
</html>
